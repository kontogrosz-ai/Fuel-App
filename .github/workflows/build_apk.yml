name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Javy (Temurin JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalacja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generowanie czystej konfiguracji Androida
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.fueltracker

      - name: Modyfikacja minSdkVersion do wersji 21 dla Google ML Kit
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/21/' android/app/build.gradle || true

      - name: Pobranie zależności Fluttera
        run: flutter pub get

      - name: Budowanie pliku APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Udostępnienie pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
