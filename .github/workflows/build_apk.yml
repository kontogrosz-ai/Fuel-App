name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Javy (Temurin JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalacja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generowanie natywnej struktury Android V2
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.fueltracker

      - name: Brutalne wymuszenie SDK na poziomie Gradle
        run: |
          # Dopisujemy na sam koniec pliku android/build.gradle regułę,
          # która nadpisze konfigurację każdej wtyczki.
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          buildToolsVersion "34.0.0"
                          defaultConfig {
                              targetSdkVersion 36
                          }
                      }
                  }
              }
          }
          EOF

          # Ustawienia dla samego projektu
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties

      - name: Konfiguracja ProGuard i wyłączenie blokad SDK
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          EOF

          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Pobranie zależności Fluttera
        run: flutter pub get

      - name: Budowanie pliku APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Udostępnienie pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
