name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Javy (Temurin JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalacja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generowanie nowej i czystej struktury Android V2 Embedding
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.fueltracker

      - name: Konfiguracja wersji SDK (Android 36 / API 36)
        run: |
          sed -i 's/compileSdkVersion .*/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/compileSdk .*/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle || true

          sed -i 's/targetSdkVersion .*/targetSdk = 36/' android/app/build.gradle || true
          sed -i 's/targetSdk .*/targetSdk = 36/' android/app/build.gradle || true
          sed -i 's/flutter.targetSdkVersion/36/' android/app/build.gradle || true

          sed -i 's/minSdkVersion .*/minSdk = 21/' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdk = 21/' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/21/' android/app/build.gradle || true

      - name: Konfiguracja ProGuard
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          EOF

      - name: Pobranie zależności Fluttera
        run: flutter pub get

      - name: Budowanie pliku APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Udostępnienie pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
