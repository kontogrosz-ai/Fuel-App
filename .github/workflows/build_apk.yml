name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Javy
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalacja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Naprawa/Generowanie poprawnych plików Android v2 embedding
        run: flutter create . --platforms=android --org com.example.fueltracker

      - name: Pobranie zależności
        run: flutter pub get

      - name: Budowanie APK
        run: flutter build apk --release

      - name: Udostępnienie pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
