name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Javy (Temurin JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalacja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generowanie czystej struktury Android
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.fueltracker

      - name: Wymuszenie SDK 36 dla wszystkich wtyczek
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { subproject ->
                  if (subproject.hasProperty('android')) {
                      subproject.android {
                          compileSdkVersion 36
                          buildToolsVersion "34.0.0"
                      }
                  }
              }
          }
          EOF

          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties

      - name: Bezpieczne dodanie podpisu debugowego dla wersji Release
        run: |
          python3 -c "
          import os

          gradle_file = 'android/app/build.gradle'
          if not os.path.exists(gradle_file):
              gradle_file = 'android/app/build.gradle.kts'

          if os.path.exists(gradle_file):
              with open(gradle_file, 'r') as f:
                  content = f.read()

              if 'build.gradle.kts' in gradle_file:
                  if 'signingConfig' not in content:
                      content = content.replace('release {', 'release {\n            signingConfig = signingConfigs.getByName(\"debug\")')
              else:
                  if 'signingConfig' not in content:
                      content = content.replace('release {', 'release {\n            signingConfig signingConfigs.debug')

              with open(gradle_file, 'w') as f:
                  f.write(content)
          "

      - name: Konfiguracja ProGuard i wyłączenie ostrzeżeń SDK
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          EOF

          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Pobranie zależności Fluttera
        run: flutter pub get

      - name: Budowanie pliku APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Udostępnienie pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/apk/release/*.apk
