name: moja_aplikacja
description: "Kompleksowa i pełna konfiguracja projektu w technologii Flutter."
publish_to: 'none' # Zapobiega przypadkowemu opublikowaniu paczki w serwisie pub.dev

# Wersja aplikacji: WERSJA_SEMANTYCZNA+BUILD_NUMBER
# Wersja przed plusem (1.0.0) określa versionName w Androidzie oraz CFBundleShortVersionString w iOS.
# Wersja po plusie (1) określa versionCode w Androidzie oraz CFBundleVersion w iOS.
version: 1.0.0+1

# Opcjonalne metadane repozytorium i projektu
repository: https://github.com/twoja-nazwa/moja_aplikacja
issue_tracker: https://github.com/twoja-nazwa/moja_aplikacja/issues
homepage: https://twoja-strona.pl

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Ikony i stylizacja UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Zarządzanie stanem i architektura
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Komunikacja sieciowa i API
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Bazy danych i lokalna pamięć podręczna
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Formatowanie i umiędzynarodowienie (i10n)
  intl: ^0.19.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Statyczna analiza kodu i reguły lintera
  flutter_lints: ^4.0.0

  # Generatory kodu (pakiety używane wyłącznie w fazie deweloperskiej)
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testowanie i makiety (mocking)
  mocktail: ^1.0.4

# Konfiguracja specyficzna dla ramki Flutter
flutter:
  # Włącza wsparcie dla ikony i komponentów Material Design
  uses-material-design: true

  # Włącza automatyczne generowanie plików tłumaczeń (intl)
  generate: true

  # Definicja katalogów zasobów (obrazy, ikony, pliki konfiguracyjne)
  assets:
    - assets/images/
    - assets/icons/
    - assets/config/env.json

  # Deklaracja własnych czcionek (pobranych lokalnie do projektu)
  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/CustomFont-Regular.ttf
        - asset: assets/fonts/CustomFont-Bold.ttf
          weight: 700
        - asset: assets/fonts/CustomFont-Italic.ttf
          style: italic

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
