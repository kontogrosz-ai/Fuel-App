name: moja_aplikacja
description: "Kompleksowa i pełna konfiguracja projektu w technologii Flutter z obsługą monitorowania paliwa."
publish_to: 'none'

version: 1.0.0+1

repository: https://github.com/twoja-nazwa/moja_aplikacja
issue_tracker: https://github.com/twoja-nazwa/moja_aplikacja/issues
homepage: https://twoja-strona.pl

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI, ikony i stylizacja
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Zarządzanie stanem i nawigacja
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Komunikacja sieciowa i API
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Bazy danych i lokalna pamięć podręczna
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Skanowanie paragonów, przetwarzanie plików, mowa i udostępnianie
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  excel: ^4.0.3
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Formatowanie i umiędzynarodowienie (i10n)
  intl: ^0.19.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Statyczna analiza kodu i reguły lintera
  flutter_lints: ^4.0.0

  # Generatory kodu
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testowanie i makiety
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
